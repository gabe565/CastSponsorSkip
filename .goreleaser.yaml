version: 2
project_name: castsponsorskip
before:
  hooks:
    - go mod download
    - go run ./internal/generate/completions --date={{ .CommitDate }}
    - go run ./internal/generate/manpages --version={{ .Version }} --date={{ .CommitDate }}
builds:
  - env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    tags:
      - grpcnotrace
    ldflags:
      - -s
      - -w
      - -X main.version={{.Version}}
    goarch:
      - amd64
      - arm
      - arm64
    goarm:
      - "6"
      - "7"
    mod_timestamp: "{{.CommitTimestamp}}"
    ignore:
      - goos: windows
        goarch: arm
archives:
  - formats: tar.gz
    # use zip for windows archives
    format_overrides:
      - goos: windows
        formats: zip
    files:
      - LICENSE
      - README.md
      - manpages/*
      - completions/*
      - systemd/{{ .ProjectName }}.service
checksum:
  name_template: "checksums.txt"
snapshot:
  version_template: "{{ incpatch .Version }}-beta"
changelog:
  sort: asc
  filters:
    exclude:
      - '^docs'
      - '^test'
  groups:
    - title: Features
      order: 0
      regexp: "(feat)"
    - title: Fixes
      order: 1
      regexp: "(fix|perf)"
    - title: Dependencies
      order: 999
      regexp: '\(deps\):'
    - title: Others
      order: 998
dockers:
  - &dockers
    image_templates:
      - ghcr.io/ap-andersson/{{ .ProjectName }}:{{ .Version }}-amd64
    use: buildx
    dockerfile: goreleaser.Dockerfile
    build_flag_templates:
      - "--platform=linux/amd64"
  - <<: *dockers
    image_templates:
      - ghcr.io/ap-andersson/{{ .ProjectName }}:{{ .Version }}-armv6
    goarch: arm
    goarm: 6
    build_flag_templates:
      - "--platform=linux/arm/v6"
  - <<: *dockers
    image_templates:
      - ghcr.io/ap-andersson/{{ .ProjectName }}:{{ .Version }}-armv7
    goarch: arm
    goarm: 7
    build_flag_templates:
      - "--platform=linux/arm/v7"
  - <<: *dockers
    image_templates:
      - ghcr.io/ap-andersson/{{ .ProjectName }}:{{ .Version }}-arm64v8
    goarch: arm64
    build_flag_templates:
      - "--platform=linux/arm64/v8"
docker_manifests:
  - &docker_manifests
    name_template: ghcr.io/ap-andersson/{{ .ProjectName }}:latest
    image_templates:
      - ghcr.io/ap-andersson/{{ .ProjectName }}:{{ .Version }}-amd64
      - ghcr.io/ap-andersson/{{ .ProjectName }}:{{ .Version }}-armv6
      - ghcr.io/ap-andersson/{{ .ProjectName }}:{{ .Version }}-armv7
      - ghcr.io/ap-andersson/{{ .ProjectName }}:{{ .Version }}-arm64v8
  - <<: *docker_manifests
    name_template: ghcr.io/ap-andersson/{{ .ProjectName }}:{{ .Version }}
  - <<: *docker_manifests
    name_template: ghcr.io/ap-andersson/{{ .ProjectName }}:{{ .Major }}
  - <<: *docker_manifests
    name_template: ghcr.io/ap-andersson/{{ .ProjectName }}:{{ .Major }}.{{ .Minor }}
nfpms:
  - id: packages
    vendor: Andreas Andersson
    homepage: https://github.com/ap-andersson/CastSponsorSkip
    description: Skip YouTube ads and sponsorships on all local Google Cast devices
    license: GPL-3.0
    maintainer: Andreas Andersson
    formats:
      - deb
      - rpm
    contents:
      - src: ./manpages/{{ .ProjectName }}.1.gz
        dst: /usr/share/man/man1/{{ .ProjectName }}.1.gz
        file_info:
          mode: 0644
      - src: ./completions/{{ .ProjectName }}.bash
        dst: /usr/share/bash-completion/completions/{{ .ProjectName }}
        file_info:
          mode: 0644
      - src: ./completions/{{ .ProjectName }}.fish
        dst: /usr/share/fish/vendor_completions.d/{{ .ProjectName }}.fish
        file_info:
          mode: 0644
      - src: ./completions/{{ .ProjectName }}.zsh
        dst:  /usr/share/zsh/vendor-completions/_{{ .ProjectName }}
        file_info:
          mode: 0644
      - src: ./systemd/{{ .ProjectName }}.service
        dst: /usr/lib/systemd/system/{{ .ProjectName }}.service
        type: config
        packager: rpm
      - src: ./systemd/{{ .ProjectName }}.service
        dst: /lib/systemd/system/{{ .ProjectName }}.service
        type: config
        packager: deb
